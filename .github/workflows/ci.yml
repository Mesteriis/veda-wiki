name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_package_release.py -v
      - run: make test
      - run: cd server && go build -o ../veda .
      - run: VEDA_TEST_CHROME="$(command -v google-chrome)" python scripts/smoke_ui.py
      - run: python -m pip install -r mcp/requirements.txt
      - run: python scripts/smoke.py
      - run: python scripts/smoke_translation_auth.py
      - run: python scripts/smoke_translation_auth.py --protocol openai
      - run: python scripts/smoke_directory_restore.py
      - run: python scripts/smoke_directory_restore.py --index
      - run: cd server && VEDA_TEST_MCP_PYTHON="$(command -v python)" go test -run '^TestMultiSourceMCPAfterSQLiteRestart$' -v .
      - name: Build Linux archives
        run: |
          python scripts/package_release.py --version ci --arch amd64 --output "$RUNNER_TEMP/veda-artifacts"
          python scripts/package_release.py --version ci --arch arm64 --output "$RUNNER_TEMP/veda-artifacts"
          cd "$RUNNER_TEMP/veda-artifacts"
          sha256sum veda-ci-linux-amd64.tar.gz veda-ci-linux-arm64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: veda-linux-ci
          path: ${{ runner.temp }}/veda-artifacts/
          if-no-files-found: error
