name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_check_tracked_secrets.py -v
      - run: python scripts/check_tracked_secrets.py
      - run: python -m unittest discover -s scripts -p test_package_release.py -v
      - run: python -m unittest discover -s scripts -p test_save_reader_key.py -v
      - run: make test
      - run: go build -o veda ./cmd/veda
      - run: python scripts/smoke_superuser.py
      - run: python scripts/smoke_dual_listener.py
      - run: node --test scripts/ui_poll.test.mjs scripts/ui_compare.test.mjs
      - run: VEDA_TEST_CHROME="$(command -v google-chrome)" python scripts/smoke_ui.py
      - run: python -m pip install -r scripts/requirements-checks.txt
      - run: python -m unittest discover -s scripts -p test_check_agent_readers.py -v
      - run: python -m unittest discover -s scripts -p test_check_file_size.py -v
      - run: python -m unittest discover -s scripts -p test_check_architecture.py -v
      - run: python scripts/smoke_mcp_https.py
      - run: python scripts/smoke.py
      - run: python scripts/smoke_translation_auth.py
      - run: python scripts/smoke_translation_auth.py --protocol openai
      - run: python scripts/smoke_directory_restore.py
      - run: python scripts/smoke_directory_restore.py --index
      - run: VEDA_TEST_MCP_PYTHON="$(command -v python)" go test -run '^(TestMultiSourceMCPAfterSQLiteRestart|TestAgentRoutesVPSRequestAcrossSources|TestReconcileThroughMCP|TestMirrorThroughMCP)$' -v ./internal/httpapi
      - run: VEDA_MIRROR_SCALE=realistic go test -run '^TestMirrorSyntheticScale$' -v -timeout 10m ./internal/syncer
      - name: Build release archives
        run: |
          for target in linux-amd64 linux-arm64 darwin-arm64; do
            python scripts/package_release.py --version ci --target "$target" --output "$RUNNER_TEMP/veda-artifacts"
          done
          cd "$RUNNER_TEMP/veda-artifacts"
          sha256sum veda-ci-linux-amd64.tar.gz veda-ci-linux-arm64.tar.gz veda-ci-darwin-arm64.tar.gz > SHA256SUMS
      - name: Install archive on fresh systemd runner
        run: scripts/smoke_fresh_systemd.sh
      - uses: actions/upload-artifact@v4
        with:
          name: veda-ci
          path: ${{ runner.temp }}/veda-artifacts/
          if-no-files-found: error
