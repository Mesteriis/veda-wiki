[project]
name = "knowledge-extractor"
version = "0.1.0"
description = "VEDA knowledge graph extraction service (GLiNER2.5, loopback HTTP)"
requires-python = "==3.12.*"
dependencies = [
    "gliner2[local]==2.1.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.2",
    "huggingface-hub==2.4.0",
    "torch==2.15.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

# Linux (CI, CPU container) takes the CPU-only torch build instead of the CUDA one.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
knowledge-extractor = "knowledge_extractor.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_model: needs the pinned GLiNER2.5 checkpoint in the local Hugging Face cache"]
addopts = "-p no:cacheprovider -m 'not real_model'"
